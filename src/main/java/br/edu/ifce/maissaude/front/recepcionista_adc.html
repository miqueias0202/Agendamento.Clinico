<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Médico</title>
<link rel="stylesheet" href="recepcionista_adc.css">
</head>
<body>

<!-- LISTA DE PROFISSIONAIS (APENAS EXEMPLO, CASO PRECISE) -->
<div class="prof-card">
    <img src="https://via.placeholder.com/120" alt="">
    <div>
        <h2>Neurologista</h2>
        <p>Dr. Livya Lea<br>R$: 199,90</p>
        <button class="remove-btn">Remover profissional</button>
    </div>
</div>

<!-- TÍTULO DA SESSÃO -->
<div class="add-title">Adicionar novo profissional</div>

<!-- FORMULÁRIO -->
<div class="add-form">

    <label>Especialidade</label>
    <input type="text" placeholder="Value">

    <label>Nome completo</label>
    <input type="text" placeholder="Value">

    <label>Valor da consulta</label>
    <input type="text" placeholder="Value">

    <label>Foto do profissional</label>

    <div class="photo-container">
        <img class="photo-placeholder" src="https://cdn-icons-png.flaticon.com/512/747/747376.png">
        <button class="upload-btn">fazer upload das imagens</button>
    </div>

</div>

<!-- BOTÃO FINAL -->
<div class="submit-wrapper">
    <button class="submit-btn">Adicionar novo profissional</button>
</div>
